schema_version = "1.0.0"

id = "moonray_hydra"
version = "0.10.0"
name = "Nanna Render"
tagline = "Render engine powered by OpenMoonRay"
maintainer = "Kiet Ho"
website = "https://github.com/htkindesign/nanna-render"
type = "add-on"
tags = ["Render"]
blender_version_min = "5.1.2"
blender_version_max = "5.1.3"
license = ["SPDX:GPL-3.0-or-later"]
platforms = ["windows-x64"]

[permissions]
files = "Writes render scenes and caches to the temp folder"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc"]
